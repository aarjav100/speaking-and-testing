version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: english-speaking-app:latest
    container_name: english-speaking-app
    restart: unless-stopped
    ports:
      - "5050:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
